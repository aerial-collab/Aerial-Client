<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aerial AI</title>
<style>
:root{--bg:#0a0d12;--surface:#121923;--line:#26323f;--muted:#a3b0bc;--white:#f5f8fa;--accent:#9bf00b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{background:#0b1016;border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,34px);display:flex;align-items:center;gap:14px}
h1{font-size:19px;margin:0}
#back{background:#26333d;color:var(--white);border:1px solid #3b4a56;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}#new{margin-left:auto;background:#26333d;color:var(--white);border:1px solid #3b4a56;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
#chat{flex:1;overflow:auto;padding:22px clamp(14px,3vw,34px)}
.wrap{max-width:820px;margin:auto}
.bubble{max-width:88%;padding:11px 14px;border-radius:14px;margin:0 0 12px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.me{background:#1d3a14;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot pre{background:#070a0f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0;white-space:pre}
.bot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bot :not(pre)>code{background:#070a0f;padding:1px 5px;border-radius:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--surface);border:1px solid var(--line);color:#d3dce3;border-radius:20px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:10px;align-items:flex-end;padding:14px clamp(14px,3vw,34px) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#0b1016}
.in{flex:1;max-width:760px;margin:auto 0 auto auto}
textarea{width:100%;font:inherit;font-size:14.5px;background:var(--surface);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:none;max-height:180px}
button.send{background:var(--accent);color:#142000;border:0;border-radius:10px;padding:12px 20px;font-weight:800;cursor:pointer;margin-right:auto}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #48b5ff;outline-offset:2px}
</style>
</head>
<body>
<header><button id="back">← Back</button><h1>Aerial AI ✨</h1><button id="new">New chat</button></header>
<div id="chat" aria-live="polite"><div class="wrap" id="log">
  <div class="bubble bot">Hey! Welcome to Aerial AI. What can I help you with today?</div>
  <div class="chips" id="chips">
    <button class="chip">Explain how GeForce NOW works</button><button class="chip">Help me fix my HTML</button><button class="chip">How does MM2 trading work?</button><button class="chip">Give me a fun fact</button></div>
</div></div>
<form id="form">
  <div class="in"><textarea id="msg" rows="1" placeholder="Message Aerial AI…" aria-label="Message"></textarea></div>
  <button class="send" id="send">Send</button>
</form>

<template id="tpl-bubble"><div class="bubble"></div></template>
<script src="ask.js"></script>
</body>
</html>
